name: Gunluk Bulten

on:
  schedule:
    # 05:37 UTC = 08:37 TR. Tam saat basi GitHub kuyrugu yogun oldugu icin
    # onceki "0 6" ile isler 4-6 saat gecikmeyle basliyordu; dakika kaydirildi.
    - cron: "37 5 * * *"
  workflow_dispatch: # Actions sekmesinden elle tetiklemek icin

# Repo public: is akisina yalnizca okuma yetkisi ver, GITHUB_TOKEN yazamasin
permissions:
  contents: read

jobs:
  bulletin:
    runs-on: ubuntu-latest
    # LLM zincirinin en kotu senaryosu (2 saglayici x 3 deneme x 180sn timeout
    # + 65sn beklemeler) ~22 dk; 15 dk sinirinda job oldurulup hata bildirimi de gitmiyordu.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Bulteni uret ve Telegram'a gonder
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: HTML raporu artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulten-${{ github.run_number }}
          path: output/*.html
          retention-days: 30
          if-no-files-found: warn
